plugins {
    id 'com.android.application' version '8.7.3'
}

def prepared = rootProject.file('generated')

android {
    namespace 'org.legoblast.game'
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.legoblast.game'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
        ndk.abiFilters 'arm64-v8a', 'x86_64'
        externalNativeBuild {
            cmake {
                arguments '-DLEGOBLAST_PLAYER_VIEW=ON', '-DBUILD_TESTING=OFF',
                          "-DLEGOBLAST_ANDROID_DEPS=${prepared.absolutePath}"
                targets 'legoblast_players'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../legoblast/CMakeLists.txt'
            version '3.31.6'
        }
    }

    sourceSets {
        main {
            java.srcDir new File(prepared, 'SDL3-3.2.30/android-project/app/src/main/java')
            assets.srcDir new File(prepared, 'assets')
            res.srcDir new File(prepared, 'res')
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }
}
