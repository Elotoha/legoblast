name: Ember Relay Windows

on:
  push:
    paths:
      - 'port/arena/**'
      - '.github/workflows/ember-relay-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: port/arena
      - name: Configurer
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S port/arena -B build -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" '-DVCPKG_TARGET_TRIPLET=x64-windows-static' '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
      - name: Compiler
        run: cmake --build build --config Release --parallel
      - name: Tester les règles et le lancement SDL
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-Relay-Windows-x64
          path: |
            build/Release/EmberRelay.exe
            port/arena/README.md
          if-no-files-found: error
