name: Joueurs LegoBlast Windows

on:
  push:
    paths:
      - 'port/legoblast/**'
      - '.github/workflows/legoblast-players-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /port/legoblast/
            /amiga/release_aminet/LegoBlast.lha
            /amiga/src/LEGO_WORLDS/*.col
            /amiga/src/binary/Lego_Level*.dat
            /amiga/src/binary/Lego_Flam_*.Dat
            /amiga/src/binary/Lego_Blocs.dat
            /amiga/src/binary/bobs_nus22.col
            /amiga/src/binary/Lego_Sprites.col
            /amiga/src/binary/Lego_SpritesIndex.dat
      - name: Configurer
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S port/legoblast -B build -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" '-DVCPKG_TARGET_TRIPLET=x64-windows-static' '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>' -DLEGOBLAST_PLAYER_VIEW=ON
      - name: Compiler et tester les routines
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
      - name: Préparer le paquet autonome
        shell: pwsh
        run: |
          7z x amiga/release_aminet/LegoBlast.lha -obuild/amiga-release -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory package/data/binary, package/data/LEGO_WORLDS | Out-Null
          Copy-Item build/Release/legoblast_players.exe package/
          Copy-Item port/legoblast/README.md package/
          Copy-Item amiga/src/binary/Lego_Level*.dat, amiga/src/binary/Lego_Flam_*.Dat package/data/binary/
          Copy-Item amiga/src/binary/Lego_Blocs.dat, amiga/src/binary/bobs_nus22.col, amiga/src/binary/Lego_Sprites.col, amiga/src/binary/Lego_SpritesIndex.dat package/data/binary/
          Copy-Item amiga/src/LEGO_WORLDS/*.col package/data/LEGO_WORLDS/
          Copy-Item build/amiga-release/binary/LEGO_SPRITES.DAT package/data/binary/
      - name: Vérifier le lancement de l’exécutable emballé
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_RENDER_DRIVER = 'software'
          & .\package\legoblast_players.exe --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LegoBlast-Joueurs-Windows-x64
          path: package/
          if-no-files-found: error
