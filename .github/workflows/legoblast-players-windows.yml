name: Joueurs LegoBlast Windows

on:
  push:
    paths:
      - 'port/legoblast/**'
      - 'port/src/audio*'
      - 'port/src/assets.hpp'
      - '.github/workflows/legoblast-players-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /port/legoblast/
            /port/src/audio*.cpp
            /port/src/audio*.hpp
            /port/src/assets.hpp
            /amiga/release_aminet/LegoBlast.lha
            /amiga/src/LegoBlast.Prefs
            /amiga/src/LEGO_WORLDS/*.col
            /amiga/src/binary/Lego_Level*.dat
            /amiga/src/binary/Lego_Flam_*.Dat
            /amiga/src/binary/Lego_Blocs.dat
            /amiga/src/binary/bobs_nus22.col
            /amiga/src/binary/Lego_Sprites.col
            /amiga/src/binary/Lego_SpritesIndex.dat
            /amiga/src/binary/Lego_Sprites8.dat
            /amiga/src/binary/Lego_SpritesIndex8.dat
            /amiga/src/binary/Mec8_normal.col
      - name: Configurer
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S port/legoblast -B build -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" '-DVCPKG_TARGET_TRIPLET=x64-windows-static' '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>' -DLEGOBLAST_PLAYER_VIEW=ON
      - name: Compiler et tester les routines
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
      - name: Préparer le paquet autonome
        shell: pwsh
        run: |
          7z x amiga/release_aminet/LegoBlast.lha -obuild/amiga-release -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory package/data/binary, package/data/LEGO_WORLDS | Out-Null
          Copy-Item build/Release/legoblast_players.exe, build/Release/legoblast_lab.exe package/
          Copy-Item port/legoblast/lia_lab package/lia_lab -Recurse
          Copy-Item port/legoblast/README.md package/
          Copy-Item amiga/src/binary/Lego_Level*.dat, amiga/src/binary/Lego_Flam_*.Dat package/data/binary/
          Copy-Item amiga/src/binary/Lego_Blocs.dat, amiga/src/binary/bobs_nus22.col, amiga/src/binary/Lego_Sprites.col, amiga/src/binary/Lego_SpritesIndex.dat package/data/binary/
          Copy-Item amiga/src/binary/Lego_Sprites8.dat, amiga/src/binary/Lego_SpritesIndex8.dat, amiga/src/binary/Mec8_normal.col package/data/binary/
          Copy-Item amiga/src/LEGO_WORLDS/*.col package/data/LEGO_WORLDS/
          Copy-Item build/amiga-release/binary/LEGO_SPRITES.DAT package/data/binary/
          Copy-Item build/amiga-release/binary/barreJ*.raw, build/amiga-release/binary/bigbloc.dat, build/amiga-release/binary/timer1.dat, build/amiga-release/binary/Jauge.Dat, build/amiga-release/binary/JaugeTeams.Dat, build/amiga-release/binary/bois.raw package/data/binary/
          Copy-Item build/amiga-release/binary/PODIUM.RAW, build/amiga-release/binary/Podium.col, build/amiga-release/binary/lego_feelings.dat package/data/binary/
          Copy-Item build/amiga-release/binary/proxima.crp, build/amiga-release/binary/Proxima.col, build/amiga-release/binary/MENU_CREDITS.RAW, build/amiga-release/binary/MENU_Credits.col, build/amiga-release/binary/MENU_Bonus2.raw, build/amiga-release/binary/MENU_Bonus.col, build/amiga-release/binary/statsblocs.dat package/data/binary/
          Copy-Item build/amiga-release/binary/MENUA.raw, build/amiga-release/binary/MENUA.col, build/amiga-release/binary/MENUB.raw, build/amiga-release/binary/MENUB.col, build/amiga-release/binary/mainmenubox.dat, build/amiga-release/binary/tinytxt8.font, build/amiga-release/binary/aachen13.font package/data/binary/
          Copy-Item port/legoblast/audio package/data/audio -Recurse
      - name: Vérifier le lancement de l’exécutable emballé
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_RENDER_DRIVER = 'software'
          $env:SDL_AUDIODRIVER = 'dummy'
          & .\package\legoblast_players.exe --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\package\legoblast_lab.exe duel .\package\data\binary\Lego_Level001.dat lia micro 1 10 1000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LegoBlast-Joueurs-Windows-x64
          path: package/
          if-no-files-found: error
